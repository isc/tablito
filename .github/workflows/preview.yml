name: Deploy branch preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  # Relance de la CI sur le commit des MP3 (cf. job `tts`).
  actions: write

# Voir le commentaire dans deploy.yml — opt-in Node 24 pour peaceiris@v4.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Génère les MP3 TTS qui manquent à la PR, pour que sa preview ait déjà le
  # son et qu'il n'y ait plus qu'à fusionner (avant, ils ne se généraient que
  # sur main, APRÈS la fusion : une matière nouvelle se testait muette).
  #
  # Hors du groupe de concurrence `gh-pages` : la génération prend quelques
  # minutes quand il y a beaucoup de MP3, et elle n'écrit pas sur gh-pages —
  # elle ne doit pas retenir les déploiements des autres PR et de main.
  tts:
    runs-on: ubuntu-latest
    # Une PR venue d'un fork n'a pas la clé Mistral : on s'en passe, sa preview
    # se construit sans les MP3 manquants.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Une seule génération à la fois par PR. Deux pushs rapprochés lançaient
    # deux générations complètes en parallèle (le double d'appels à l'API), et
    # la plus lente écrasait les MP3 de l'autre. La plus récente l'emporte :
    # elle porte le contenu le plus à jour.
    concurrency:
      group: tts-${{ github.head_ref }}
      cancel-in-progress: true
    outputs:
      count: ${{ steps.new.outputs.count }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Idempotent : ne génère que les fichiers absents, donc rien (et aucun
      # appel à l'API) sur une PR qui n'ajoute pas de clé. Un échec partiel
      # (rate limit) ne bloque pas la preview : les fichiers produits sont
      # gardés, le push suivant reprend les manquants.
      - name: Generate missing MP3s
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/generate-tts.mjs

      # Les nouveaux MP3 sont les fichiers non suivis de public/audio/tts. Ils
      # sont mis de côté avec leur chemin, seuls : l'artefact ne transporte pas
      # les ~55 Mo de MP3 déjà commités.
      - name: List new MP3s
        id: new
        run: |
          git ls-files --others --exclude-standard public/audio/tts > "$RUNNER_TEMP/new-mp3.txt"
          count=$(wc -l < "$RUNNER_TEMP/new-mp3.txt")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count nouveaux MP3"
          while IFS= read -r f; do
            mkdir -p "$RUNNER_TEMP/tts-new/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/tts-new/$f"
          done < "$RUNNER_TEMP/new-mp3.txt"

      # Pour le build de la preview (job suivant), qui part d'un checkout neuf.
      - name: Hand the new MP3s to the preview build
        if: steps.new.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: tts-mp3
          path: ${{ runner.temp }}/tts-new/
          retention-days: 1

      # Commit sur la BRANCHE de la PR, pour que la fusion les emporte. Le
      # checkout ci-dessus est le commit de fusion PR+main (detached) : on
      # repart donc de la tête de la branche dans un worktree à part, et on y
      # copie les seuls nouveaux fichiers, sans jamais écraser un MP3 que la
      # branche a déjà (commité entre-temps par une autre génération) : rien à
      # commiter alors. Si la branche a bougé entre-temps, le push échoue sans
      # dommage : le push suivant relance cette génération.
      #
      # Un push fait avec le GITHUB_TOKEN ne déclenche aucun workflow (ni cette
      # preview, donc pas de boucle, ni la CI) : la CI est relancée à la main
      # sur la branche, pour que le dernier commit de la PR ait ses tests.
      - name: Commit the new MP3s to the PR branch
        if: steps.new.outputs.count != '0'
        env:
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$HEAD_REF"
          git worktree add "$RUNNER_TEMP/head" FETCH_HEAD
          cp -Rn "$RUNNER_TEMP/tts-new/." "$RUNNER_TEMP/head/"
          cd "$RUNNER_TEMP/head"
          git add public/audio/tts
          if git diff --cached --quiet; then
            echo "Ces MP3 sont déjà sur la branche : rien à commiter."
            exit 0
          fi
          git commit -m "assets(tts): MP3 générés par la preview"
          if git push origin "HEAD:refs/heads/$HEAD_REF"; then
            gh workflow run ci.yml --ref "$HEAD_REF"
          else
            echo "::warning::La branche a bougé : MP3 non commités, le prochain push les régénère."
          fi

  build-and-deploy:
    needs: tts
    # Aussi quand `tts` est sauté (fork) ou a échoué : la preview passe avant.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      # Serialize gh-pages writes across all preview jobs AND the main deploy,
      # otherwise two jobs can race on the same branch.
      # `queue: max` : voir le commentaire dans deploy.yml.
      group: gh-pages
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6

      # Les MP3 générés par `tts`, s'il y en a : la preview a déjà le son.
      - name: Fetch the MP3s generated for this PR
        if: needs.tts.outputs.count != '' && needs.tts.outputs.count != '0'
        uses: actions/download-artifact@v4
        with:
          name: tts-mp3
          path: .

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Slug = branch name with any non-alphanumeric char collapsed to `-`.
      # Example: `claude/document-leitner-choice-9dMPQ`
      #       -> `claude-document-leitner-choice-9dMPQ`
      # Le nom de branche passe par l'env, jamais interpolé dans le script :
      # choisi par l'auteur de la PR (fork compris), une apostrophe y
      # fermerait les guillemets et exécuterait du shell sur le runner.
      # Même fonction `slug` dans preview-cleanup.yml, qui supprime tout
      # `previews/<slug>` sans PR ouverte : scripts/preview-slug.test.mjs
      # vérifie que les deux lignes sont identiques.
      # Un nom sans lettre ni chiffre ASCII (`_`, `+`, `é`, valides pour git)
      # donne un slug vide : le build serait publié à la racine de previews/,
      # mêlé aux previews des autres PR. On s'arrête donc avant le build.
      - name: Compute preview slug
        id: slug
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          slug() { echo "$1" | tr -c 'a-zA-Z0-9-' '-' | tr -s '-' | sed 's/^-\|-$//g'; }
          slug=$(slug "$HEAD_REF")
          [ -n "$slug" ] || { echo "::error::Slug de preview vide pour la branche '$HEAD_REF' : rien n'est publié."; exit 1; }
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "base=/previews/$slug/" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
        env:
          BASE: ${{ steps.slug.outputs.base }}

      - run: npx playwright install --with-deps chromium
      - run: npm run user-guide
        env:
          # Required so the preview server serves at the same base as the
          # built assets, and the user-guide script navigates to the right URL.
          BASE: ${{ steps.slug.outputs.base }}

      # Marker poll-able from GitHub Pages once it's actually serving the
      # fresh build. Used by the wait step below — without it, the PR
      # comment lands before Pages has finished propagating, and clicking
      # the link gives a 404 (or stale content on subsequent pushes).
      - name: Write deployment marker
        run: echo "${{ github.event.pull_request.head.sha }}" > dist/.preview-sha

      - name: Publish to gh-pages (previews/${{ steps.slug.outputs.slug }})
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: previews/${{ steps.slug.outputs.slug }}
          keep_files: true
          commit_message: 'preview: ${{ steps.slug.outputs.slug }} @ ${{ github.event.pull_request.head.sha }}'

      - name: Wait for GitHub Pages to serve fresh preview
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          url="https://tablito.app/previews/$SLUG/.preview-sha"
          for i in $(seq 1 60); do
            actual=$(curl -fsSL --max-time 10 "$url" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "Preview live with $EXPECTED_SHA after ${i}×5s"
              exit 0
            fi
            echo "Attempt $i/60: got '$actual', want '$EXPECTED_SHA'"
            sleep 5
          done
          echo "::warning::Preview did not become live with the expected SHA in 5 minutes — comment posted anyway"

      # Wrapped in wretry parce que l'API GitHub issues renvoie parfois un
      # 504 transitoire sur ce step (cf. run 24829541258). 3 tentatives
      # espacées de 10 s suffisent dans quasi tous les cas.
      - name: Comment PR with preview links
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: marocchino/sticky-pull-request-comment@v2
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            header: preview-${{ steps.slug.outputs.slug }}
            message: |
              **Preview déployée** pour cette PR :

              - App : https://tablito.app/previews/${{ steps.slug.outputs.slug }}/
              - Guide : https://tablito.app/previews/${{ steps.slug.outputs.slug }}/guide/

              Commit : `${{ github.event.pull_request.head.sha }}`
              _Le preview est mis à jour à chaque push et supprimé à la fermeture de la PR._
