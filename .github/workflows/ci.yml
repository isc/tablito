name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Relancée par la preview sur le commit de MP3 qu'elle pousse sur la branche
  # d'une PR : un push du GITHUB_TOKEN ne déclenche pas `pull_request`.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
